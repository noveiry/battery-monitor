apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts
  namespace: battery

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alerts

  template:
    metadata:
      labels:
        app: alerts

    spec:
      containers:
        - name: alerts

          image: battery-alerts:1.0

          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: battery-config

          ports:
            - containerPort: 8081

          readinessProbe:
            httpGet:
              path: /health
              port: 8081

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: alerts
  namespace: battery

spec:
  selector:
    app: alerts

  ports:
    - port: 8081
      targetPort: 8081